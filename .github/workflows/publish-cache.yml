name: Publish Binary Cache

# Builds this flake's aarch64-darwin outputs (the pinned claude-code) and pushes
# the signed NARs to ghcr.io/<owner>/<repo>/nix-cache. The build logic lives
# once in pplanel/nixcache as a reusable workflow; this is just the thin caller.
#
# The cache holds Anthropic's proprietary Claude Code binary, so its GHCR
# package stays PRIVATE: don't make it public (that would redistribute it).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: pplanel/nixcache/.github/workflows/publish-cache.yml@main
    secrets: inherit
    # The build only downloads Anthropic's binary and wraps it (no Xcode,
    # sandbox-friendly), so a GitHub-hosted Apple-Silicon runner (the reusable
    # workflow's default, macos-15) is enough.

  # Fail loudly unless the cache package is private. A public package can't be
  # made private again; if this fails, delete the package in its settings.
  # Fails closed: not being able to read the visibility is a failure too.
  verify-private:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: The nix-cache package must be private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}%2Fnix-cache
          OWNER: ${{ github.repository_owner }}
        run: |
          if ! v=$(gh api "/users/$OWNER/packages/container/$PACKAGE" --jq .visibility); then
            echo "::error::Couldn't read the visibility of ghcr.io/${{ github.repository }}/nix-cache. Check it by hand; it must be private."
            exit 1
          fi
          echo "ghcr.io/${{ github.repository }}/nix-cache visibility: $v"
          if [ "$v" != "private" ]; then
            echo "::error::ghcr.io/${{ github.repository }}/nix-cache is $v. It holds Anthropic's binary and must stay private: delete the package now."
            exit 1
          fi
